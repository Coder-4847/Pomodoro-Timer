name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (app files only)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js assets _site/
          touch _site/.nojekyll
          # Give every release its own service-worker cache.
          sed -i "s/const BUILD = \"dev\";/const BUILD = \"${GITHUB_SHA::8}\";/" _site/sw.js
          grep -n "const BUILD" _site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
